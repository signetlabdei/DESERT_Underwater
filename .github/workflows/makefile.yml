name: DESERT CI

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y build-essential autoconf automake clang-format libxmu-dev libx11-dev libxmu-dev libxmu-headers libxt-dev libtool gfortran bison flex

    - name: Check formatting of changed source files
      env:
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          git diff-tree --root --no-commit-id --name-only --diff-filter=AM -z "$GITHUB_SHA" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx'
        else
          git diff --name-only --diff-filter=AM -z "$BASE_SHA" "$GITHUB_SHA" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx'
        fi | xargs -0 -r clang-format --dry-run --Werror --style=file
    
    - name: Install DESERT
      run: cd DESERT_Framework && ./install.sh --target LOCAL --inst_mode development --dest_folder /tmp/DESERT_buildCopy_LOCAL --with-woss --addons "packer_uwApplication packer_uwcbr packer_uwcsma_ca packer_uwflooding packer_uwip packer_uwpolling packer_uwudp packer_uwufetch uwrov uwtracker uwswarm_control uwmulti_stack_controller uwmulti_traffic_control uwmulti_destination uwmphy_modem ms2c_evologics_lowlev wossgmmob3D wossgroupmob3D "

    - name: Run DESERT smoke test
      working-directory: DESERT_Framework/DESERT/samples/desert_samples/Application
      run: |
        source /tmp/DESERT_buildCopy_LOCAL/environment
        timeout 60s ns test_uwcbr.tcl

  compile-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx_compiler: g++
            compiler_packages: ""
          - os: ubuntu-24.04
            compiler: gcc-12
            cxx_compiler: g++-12
            compiler_packages: gcc-12 g++-12
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y build-essential autoconf automake libxmu-dev libx11-dev libxmu-dev libxmu-headers libxt-dev libtool gfortran bison flex ${{ matrix.compiler_packages }}

    - name: Select compiler
      run: |
        echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
        echo "CXX=${{ matrix.cxx_compiler }}" >> "$GITHUB_ENV"
        ${{ matrix.compiler }} --version
        ${{ matrix.cxx_compiler }} --version

    - name: Compile DESERT
      run: cd DESERT_Framework && ./install.sh --target LOCAL --inst_mode development --dest_folder /tmp/DESERT_buildCopy_LOCAL --with-woss --addons "packer_uwApplication packer_uwcbr packer_uwcsma_ca packer_uwflooding packer_uwip packer_uwpolling packer_uwudp packer_uwufetch uwrov uwtracker uwswarm_control uwmulti_stack_controller uwmulti_traffic_control uwmulti_destination uwmphy_modem ms2c_evologics_lowlev wossgmmob3D wossgroupmob3D "

  publish-docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: docker-release
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push release image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: DESERT_Framework/Dockerfile
        build-args: |
          DESERT_TAG=${{ github.ref_name }}
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ${{ env.IMAGE_NAME }}:latest



